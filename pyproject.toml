[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-change-lens"
version = "0.1.0"
description = "Offline CSV change reviews with explicit decimal tolerances and value-hidden reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "csv-change-lens contributors"}]
dependencies = []
keywords = ["csv", "diff", "research", "cli", "data-validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/cuijialin8888-code/csv-change-lens"
Issues = "https://github.com/cuijialin8888-code/csv-change-lens/issues"

[project.scripts]
csv-change-lens = "csv_change_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
