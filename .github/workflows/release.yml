name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Verify version tag
        run: |
          python -c "import os,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME']=='v'+version"
      - name: Install build tools
        run: python -m pip install build ruff
      - name: Lint and build
        run: |
          python -m ruff check src tests
          python -m build
      - name: Test installed release wheel
        run: |
          python -m pip install --no-index --no-deps dist/*.whl
          python -m unittest discover -s tests -v
          csv-change-lens --version
      - name: Generate checksums
        run: |
          python -c "from pathlib import Path; import hashlib; root=Path('dist'); assets=sorted(root.iterdir()); (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets),encoding='utf-8')"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "csv-change-lens $GITHUB_REF_NAME" --notes-file docs/release-notes.md
